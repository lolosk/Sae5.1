services:
  api:
    build: ../../apps/backend
    env_file: .env
    volumes:
      - ../../apps/backend:/app
      - "${MEDIA_DIR}:/app/media:ro"
    ports:
      - "${APP_PORT}:8080"
    depends_on: [db]

  web:
    build: ../../apps/frontend
    environment:
      - VITE_API_URL=http://localhost:${APP_PORT}
    volumes:
      - ../../apps/frontend:/app
    ports:
      - "${FRONT_PORT}:5173"
    depends_on: [api]

  db:
    image: mysql:8
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./db/data:/var/lib/mysql
