services:
  api:
    build: ../../apps/mock-api
    env_file: .env
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - ../../apps/mock-api:/app
      - "${MEDIA_DIR}:/app/media:ro"
    ports:
      - "${APP_PORT}:8080"
    depends_on: [db]

  web:
    build: ../../apps/frontend
    environment:
      - VITE_API_URL=/api
    volumes:
      - ../../apps/frontend:/app
    ports:
      - "${FRONT_PORT}:5173"
    depends_on: [api]

  db:
    image: mysql:8
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./db/data:/var/lib/mysql
