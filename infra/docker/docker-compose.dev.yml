services:
  api:
    build: ../../apps/mock-api
    environment:
      - PORT=8080
    volumes:
      - ../../apps/mock-api:/app
      - "${MEDIA_DIR}:/app/media:ro"
    ports:
      - "${APP_PORT}:8080"

  web:
    build: ../../apps/frontend
    environment:
      - VITE_API_URL=/api
    volumes:
      - ../../apps/frontend:/app
    ports:
      - "${FRONT_PORT}:5173"
    depends_on: [api]
