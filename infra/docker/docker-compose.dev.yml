services:
  api:
    build: ../../apps/backend
    env_file: .env
    volumes:
      - ../../apps/backend:/app
      - "${MEDIA_DIR}:/app/media:ro"
    expose:
      - "8080"
    depends_on: [db]

  web:
    build: ../../apps/frontend
    environment:
      - VITE_API_URL=/api
    volumes:
      - ../../apps/frontend:/app
    expose:
      - "5173"
    depends_on: [api]

  proxy:
    image: nginx:alpine
    ports:
      - "41027:80"          # ✅ TON port WAN/LAN unique
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, api]

  db:
    image: mysql:8
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./db/data:/var/lib/mysql
